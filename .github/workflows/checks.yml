name: ESP32 checks
on:
  push:
  pull_request:
  schedule:
    - cron: '7 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  esp32-host:
    # The README Quickstart in a fresh checkout, then USB integration against gateway main.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: grok-gadgets-esp32-sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: grok-gadgets-esp32-sdk
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: adidshaft/grok-gadgets-gateway
          ref: main
          path: grok-gadgets-gateway
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.12.3'
      - run: python tools/check_readme.py
      - name: Plain language (ASD-STE100 sentence limit)
        run: python tools/check_ste.py README.md CONTRIBUTING.md SUPPORT.md docs/updates.md docs/core-3x-decision.md docs/ship-a-gadget.md
      - name: Library manifests agree and pack (nothing is published)
        run: .venv/bin/python tools/check_package.py
      - name: Simulated firmware over a PTY USB link to gateway main
        run: |
          (cd ../grok-gadgets-gateway && uv sync --locked --python 3.11 && git log -1 --format='Gateway main %H')
          ../grok-gadgets-gateway/.venv/bin/python tools/check_gateway.py
  esp32-firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m venv .venv && .venv/bin/pip install -r requirements.lock
      - run: .venv/bin/pio run -e atoms3-lite-usb -e esp32s3-led-button -e esp32s3-oled-kit -e esp32s3-oled-kit-wifi -e esp32s3-oled-kit-wifi-updates -e esp32s3-climate-sensor -e esp32s3-switch -e esp32s3-servo -e esp32s3-template
