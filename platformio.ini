[platformio]
default_envs = atoms3-lite-usb

[esp32s3]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.0
    espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5
    platformio/tool-esptoolpy@1.40501.0
    platformio/tool-scons@4.40801.0
    espressif/toolchain-riscv32-esp@8.4.0+2021r2-patch5
build_unflags = -std=gnu++11
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -std=gnu++14
    ; Keep checkout and PlatformIO home paths out of the image hash.
    -ffile-prefix-map=$PROJECT_DIR=.
    -ffile-prefix-map=$PROJECT_CORE_DIR=/platformio
lib_deps =
    bblanchon/ArduinoJson@6.21.5
upload_speed = 460800
monitor_speed = 115200

[env:atoms3-lite-usb]
extends = esp32s3
lib_deps =
    ${esp32s3.lib_deps}
    adafruit/Adafruit NeoPixel@1.12.3

; Compile check for the generic example. Pins are not verified on hardware.
[env:esp32s3-led-button]
extends = esp32s3
extra_scripts = pre:examples/led-button/pio_src.py

; Ordered ESP32-S3-N16R8 OLED kit: 16 MB quad flash, 8 MB octal PSRAM, native USB.
; The delivered display is an SH1106. Add -DOLED_KIT_SSD1306 for SSD1306 modules and
; -DOLED_KIT_RGB_PIN=38 for boards with the RGB pixel on GPIO38.
[env:esp32s3-oled-kit]
extends = esp32s3
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    ${esp32s3.build_flags}
    -DBOARD_HAS_PSRAM
lib_deps =
    ${esp32s3.lib_deps}
    olikraus/U8g2@2.36.18
extra_scripts = pre:examples/oled-kit/pio_src.py

; The same kit over Wi-Fi (hub ADR 005): TLS to the gateway LAN listener with the CA pinned at
; provisioning. Provision over USB with `grok-gadgets-gateway wifi-provision`.
[env:esp32s3-oled-kit-wifi]
extends = env:esp32s3-oled-kit
build_flags =
    ${env:esp32s3-oled-kit.build_flags}
    -DOLED_KIT_WIFI
; Signed updates (hub ADR 012): set GROK_UPDATE_PUBLIC_KEY to your public key file to build an
; image that takes updates; without it the image never asks. GROK_FIRMWARE_VERSION sets the
; version it reports. See docs/updates.md.
extra_scripts =
    ${env:esp32s3-oled-kit.extra_scripts}
    pre:tools/update_build.py

; Compile check of the update path with the gateway fixture's public test key. Never flash it:
; nobody holds that key's private half, so it could never take an update.
[env:esp32s3-oled-kit-wifi-updates]
extends = env:esp32s3-oled-kit-wifi
custom_update_public_key = protocol/0.1.0/fixtures/update-transcript.json
custom_update_board = esp32s3-oled-kit-wifi

; Builder examples (hub ADR 013 §6): Wi-Fi gadgets without a display on the relay, with phone
; setup, claim codes on the setup page and signed updates (GROK_UPDATE_PUBLIC_KEY). Same board
; as the OLED kit. Not tested on hardware until someone runs them with the parts.
[wifi-example]
extends = esp32s3
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    ${esp32s3.build_flags}
    -DBOARD_HAS_PSRAM

[env:esp32s3-climate-sensor]
extends = wifi-example
extra_scripts =
    pre:examples/climate-sensor/pio_src.py
    pre:tools/update_build.py

[env:esp32s3-switch]
extends = wifi-example
extra_scripts =
    pre:examples/switch/pio_src.py
    pre:tools/update_build.py

[env:esp32s3-servo]
extends = wifi-example
extra_scripts =
    pre:examples/servo/pio_src.py
    pre:tools/update_build.py
