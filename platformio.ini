[platformio]
default_envs = atoms3-lite-usb

[env:atoms3-lite-usb]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.0
    espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5
    platformio/tool-esptoolpy@1.40501.0
    platformio/tool-scons@4.40801.0
    espressif/toolchain-riscv32-esp@8.4.0+2021r2-patch5
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -std=gnu++14
lib_deps =
    bblanchon/ArduinoJson@6.21.5
    adafruit/Adafruit NeoPixel@1.12.3
upload_speed = 460800
monitor_speed = 115200
